<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Dev Console</title>
<style>
  :root { --bg:#0f1117; --panel:#1a1d29; --border:#2a2e3d; --fg:#e6e6ea; --mut:#8b90a0; --acc:#5b8def; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  header select { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; min-width:320px; }
  header button, .btn { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  header button.ghost { background:transparent; border:1px solid var(--border); color:var(--fg); }
  nav { display:flex; gap:4px; padding:8px 20px 0; border-bottom:1px solid var(--border); background:var(--panel); }
  nav button { background:transparent; border:0; border-bottom:2px solid transparent; color:var(--mut); padding:8px 14px; cursor:pointer; font-size:13px; }
  nav button.active { color:var(--fg); border-bottom-color:var(--acc); }
  main { padding:20px; max-width:1400px; margin:0 auto; }
  .tab { display:none; } .tab.active { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .card h3 { margin:0 0 8px; font-size:14px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .mut { color:var(--mut); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--mut); font-weight:500; }
  tr:hover td { background:#20242f; }
  code, pre { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  pre { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px; overflow:auto; max-height:340px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .row input, .row select { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; }
  .muted-empty { color:var(--mut); padding:20px; text-align:center; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; background:#262b3a; font-size:11px; color:#c8cde0; }
  .tag { font-size:11px; color:var(--mut); }
  .ev-subject { color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>🛰 Outreach Dev Console</h1>
  <span class="spacer"></span>
  <label class="mut">Тенант:</label>
  <select id="tenantSel"><option value="">— выберите —</option></select>
  <button class="ghost" onclick="loadTenants()">⟳</button>
  <button onclick="showCreateTenant()">+ Тенант</button>
</header>
<nav>
  <button class="active" data-tab="services">Сервисы</button>
  <button data-tab="events">События NATS</button>
  <button data-tab="companies">Компании</button>
  <button data-tab="contacts">Контакты</button>
  <button data-tab="briefs">Брифы</button>
  <button data-tab="icps">ICP</button>
  <button data-tab="searches">Поиски</button>
  <button data-tab="messages">Письма</button>
  <button data-tab="stoplist">Stop-list</button>
</nav>
<main>
  <div id="services" class="tab active">
    <div class="grid" id="servicesGrid"></div>
  </div>

  <div id="events" class="tab">
    <div class="row">
      <label class="mut">Стрим:</label>
      <select id="streamSel"></select>
      <label class="mut">Subject:</label>
      <input id="subjectFilter" value=">" style="width:220px">
      <button onclick="loadEvents()">Показать</button>
      <span class="mut" id="eventsMeta"></span>
    </div>
    <div id="streamsGrid" class="grid" style="margin-bottom:16px"></div>
    <div id="eventsList"></div>
  </div>

  <div id="companies" class="tab"><div id="companiesList"></div></div>
  <div id="contacts" class="tab"><div id="contactsList"></div></div>
  <div id="briefs" class="tab"><div id="briefsList"></div></div>
  <div id="icps" class="tab"><div id="icpsList"></div></div>
  <div id="searches" class="tab"><div id="searchesList"></div></div>
  <div id="messages" class="tab"><div id="messagesList"></div></div>
  <div id="stoplist" class="tab"><div id="stoplistList"></div></div>
</main>

<script>
const state = { tenant: localStorage.getItem('tenant') || '' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortId = (s) => s ? String(s).slice(0,8) : '';
const dt = (s) => s ? new Date(s).toLocaleString('ru-RU') : '';

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $(b.dataset.tab).classList.add('active');
  if (b.dataset.tab !== 'services' && b.dataset.tab !== 'events') loadData(b.dataset.tab);
});

async function api(path, opts) {
  const r = await fetch(path, opts);
  return { status: r.status, body: await r.json().catch(() => null) };
}

async function loadServices() {
  const { body } = await api('/api/services');
  $('servicesGrid').innerHTML = (body || []).map(s => `
    <div class="card">
      <h3><span class="dot ${s.ok ? 'ok' : 'bad'}"></span>${esc(s.service)}</h3>
      <div class="mut">${s.ok ? 'healthy' : esc(s.error || ('HTTP ' + s.status))}</div>
      <div style="margin-top:8px"><a href="/docs/${esc(s.service)}" target="_blank" class="tag">OpenAPI /docs →</a></div>
    </div>`).join('');
}

async function loadTenants() {
  const { body } = await api('/api/tenants');
  const sel = $('tenantSel');
  const tenants = (Array.isArray(body) ? body : []).filter(t => t.status !== 'archived');
  sel.innerHTML = '<option value="">— выберите —</option>' + tenants.map(t =>
    `<option value="${esc(t.id)}">${esc(t.name)} (${esc(t.slug)}) ${shortId(t.id)}</option>`).join('');
  if (state.tenant) sel.value = state.tenant;
}

$('tenantSel').onchange = (e) => {
  state.tenant = e.target.value;
  localStorage.setItem('tenant', state.tenant);
  const active = document.querySelector('nav button.active').dataset.tab;
  if (active !== 'services' && active !== 'events') loadData(active);
};

async function showCreateTenant() {
  const name = prompt('Название тенанта:'); if (!name) return;
  const slug = prompt('Slug (a-z0-9-):', name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));
  if (!slug) return;
  const r = await api('/api/tenants', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, slug }) });
  if (r.status === 201) { state.tenant = r.body.id; localStorage.setItem('tenant', state.tenant); await loadTenants(); loadServices(); }
  else alert('Ошибка: ' + JSON.stringify(r.body));
}

async function loadEvents() {
  const stream = $('streamSel').value;
  const subject = $('subjectFilter').value || '>';
  $('eventsList').innerHTML = '<div class="muted-empty">загрузка…</div>';
  const { body } = await api(`/api/events?stream=${encodeURIComponent(stream)}&subject=${encodeURIComponent(subject)}&limit=25`);
  const list = Array.isArray(body) ? body : [];
  $('eventsMeta').textContent = `${list.length} сообщений`;
  if (!list.length) { $('eventsList').innerHTML = '<div class="muted-empty">нет сообщений</div>'; return; }
  $('eventsList').innerHTML = list.map(e => `
    <div class="card" style="margin-bottom:10px">
      <div><span class="pill">${esc(e.event_type || '?')}</span>
        <span class="ev-subject"> ${esc(e.subject)}</span></div>
      <div class="mut" style="margin:6px 0">${esc(e.producer || '')} · ${dt(e.occurred_at)} · tenant ${shortId(e.tenant_id)}</div>
      <pre>${esc(JSON.stringify(e.payload, null, 2))}</pre>
    </div>`).join('');
}

async function loadStreams() {
  const { body } = await api('/api/streams');
  const streams = Array.isArray(body) ? body : [];
  $('streamsGrid').innerHTML = streams.map(s => `
    <div class="card"><h3>${esc(s.name)}</h3>
      <div class="mut">${s.messages ?? '?'} msgs · ${((s.bytes||0)/1024).toFixed(1)} KiB · ${s.consumers ?? 0} consumers</div>
      <div class="tag" style="margin-top:6px">${esc((s.subjects||[]).join(', '))}</div>
    </div>`).join('');
  $('streamSel').innerHTML = streams.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
}

const renderers = {
  companies: (rows) => table(rows, [
    ['id', r => shortId(r.id)], ['name', r => r.payload?.name?.value],
    ['domain', r => r.payload?.domain?.value], ['status', r => r.status],
    ['contacts', r => r.contacts_count], ['created', r => dt(r.created_at)]]),
  contacts: (rows) => table(rows, [
    ['id', r => shortId(r.id)], ['name', r => r.payload?.full_name?.value],
    ['email', r => r.primary_email || r.payload?.emails?.[0]?.value],
    ['position', r => r.payload?.position?.value], ['status', r => r.status],
    ['created', r => dt(r.created_at)]]),
  messages: (rows) => table(rows, [
    ['id', r => shortId(r.id)], ['status', r => r.status],
    ['subject', r => r.subject], ['words', r => r.word_count],
    ['created', r => dt(r.created_at)]]),
  searches: (rows) => table(rows, [
    ['id', r => shortId(r.id)], ['status', r => r.status],
    ['raw', r => r.candidates_raw_count], ['persisted', r => r.candidates_persisted_count],
    ['cost', r => '$'+(r.total_cost_usd||0).toFixed(4)],
    ['created', r => dt(r.created_at)]]),
  icps: (rows) => table(rows, [
    ['id', r => shortId(r.id)], ['brief', r => shortId(r.brief_id)],
    ['ver', r => r.version], ['active', r => r.is_active ? '✓' : ''],
    ['segments', r => r.segments_count], ['conf', r => r.llm_confidence],
    ['created', r => dt(r.created_at)]]),
  briefs: (rows) => table(rows, [
    ['id', r => shortId(r.id)], ['project', r => r.identity?.project_name],
    ['status', r => r.status], ['completeness', r => r.completeness_score],
    ['q&a', r => (r.qa_history||[]).length], ['created', r => dt(r.created_at)]]),
  stoplist: (rows) => table(rows, [
    ['kind', r => r.kind], ['value', r => r.value], ['reason', r => r.reason],
    ['scope', r => r.scope], ['created', r => dt(r.created_at)]]),
};

function table(rows, cols) {
  if (!Array.isArray(rows) || !rows.length) return '<div class="muted-empty">пусто</div>';
  const head = cols.map(c => `<th>${esc(c[0])}</th>`).join('');
  const body = rows.map(r => '<tr>' + cols.map(c => `<td>${esc(c[1](r))}</td>`).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function loadData(kind) {
  const target = $({companies:'companiesList',contacts:'contactsList',briefs:'briefsList',stoplist:'stoplistList'}[kind]);
  if (!state.tenant) { target.innerHTML = '<div class="muted-empty">выберите тенант вверху</div>'; return; }
  target.innerHTML = '<div class="muted-empty">загрузка…</div>';
  const { body } = await api(`/api/data/${kind}?tenant=${encodeURIComponent(state.tenant)}`);
  target.innerHTML = renderers[kind](body);
}

(async function init() {
  await loadTenants();
  await loadServices();
  await loadStreams();
  setInterval(loadServices, 15000);
})();
</script>
</body>
</html>
