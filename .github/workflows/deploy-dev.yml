name: Deploy to Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/20260930-outreachos
          git pull --ff-only
          docker compose -f infra/docker-compose.dev.yml --env-file .env build
          docker compose -f infra/docker-compose.dev.yml --env-file .env up -d --remove-orphans
          EOF
