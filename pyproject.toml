[project]
name = "outreach-os"
version = "0.1.0"
description = "Outreach OS — мульти-тенантная API-first платформа для целевого outreach"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }
db = { workspace = true }
nats-client = { workspace = true }
llm-client = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "UP046", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["common", "contracts", "db", "nats_client", "llm_client"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "libs/common/src:libs/contracts/src:libs/db/src:libs/nats-client/src:libs/llm-client/src:services/tenant-service/src:services/llm-gateway/src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
addopts = "--import-mode=importlib -m 'not integration'"
