    ports:
      - "0.0.0.0:${ORCHESTRATOR_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}
      icp-service: {condition: service_started}
      sourcing-service: {condition: service_started}
      composer-service: {condition: service_started}
