      DATABASE_URL_MIGRATION: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CONTACT_STORE_FUZZY_MATCH: "false"
      CONTACT_STORE_GLOBAL_STOPLIST: "true"
    ports:
      - "0.0.0.0:${CONTACT_STORE_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}

  dev-console:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/dev-console/Dockerfile
    container_name: outreach-os-dev-console
    environment:
      SERVICE_NAME: dev-console
      SERVICE_PORT: "8000"
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_ADMIN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
      TENANT_SERVICE_URL: http://tenant-service:8000
      BRIEF_SERVICE_URL: http://brief-service:8000
      LLM_GATEWAY_URL: http://llm-gateway:8000
      CONTACT_STORE_URL: http://contact-store:8000
      ICP_SERVICE_URL: http://icp-service:8000
      SOURCING_SERVICE_URL: http://sourcing-service:8000
      COMPOSER_SERVICE_URL: http://composer-service:8000
      REVIEW_QUEUE_URL: http://review-queue:8000
      SENDER_EMAIL_URL: http://sender-email:8000
      REPLY_CLASSIFIER_URL: http://reply-classifier:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      EXPERIMENTS_SERVICE_URL: http://experiments-service:8000
      ORCHESTRATOR_URL: http://orchestrator:8000
      AUTO_REVISION_URL: http://auto-revision:8000
      TELEGRAM_SENDER_URL: http://telegram-sender:8000
      LINKEDIN_SENDER_URL: http://linkedin-sender:8000
      USERS_URL: http://users-service:8000
      CAMPAIGNS_URL: http://campaign-service:8000
      WHATSAPP_URL: http://whatsapp-sender:8000
      REALTIME_URL: http://realtime-gateway:8000
      ML_SCORING_URL: http://ml-scoring-service:8000
    ports:
      - "0.0.0.0:${DEV_CONSOLE_PORT}:8000"
    depends_on:
      nats: {condition: service_healthy}

  icp-service:
