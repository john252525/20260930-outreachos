      COMPOSER_SERVICE_URL: http://composer-service:8000
    ports:
      - "0.0.0.0:${REVIEW_QUEUE_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}

  sender-email:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/sender-email/Dockerfile
    container_name: outreach-os-sender-email
    environment:
      SERVICE_NAME: sender-email
      SERVICE_PORT: "8000"
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_MIGRATION: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
