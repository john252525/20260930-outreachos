name: outreach-os

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [outreach-net]
  env_file: [../.env]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: outreach-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [outreach-net]

  nats:
    image: nats:2.10.22-alpine
    container_name: outreach-os-nats
    restart: unless-stopped
    command: [
      "-c", "/etc/nats/nats-server.conf",
      "--user", "${NATS_USER}",
      "--pass", "${NATS_PASSWORD}",
    ]
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "127.0.0.1:${NATS_PORT}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [outreach-net]

  redis:
    image: redis:7.4.1-alpine
    container_name: outreach-os-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [outreach-net]

  tenant-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/tenant-service/Dockerfile
    container_name: outreach-os-tenant-service
    environment:
      SERVICE_NAME: tenant-service
      SERVICE_PORT: "8000"
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_MIGRATION: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LLM_GATEWAY_URL: http://llm-gateway:8000
    ports:
      - "0.0.0.0:${TENANT_SERVICE_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}

  llm-gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/llm-gateway/Dockerfile
    container_name: outreach-os-llm-gateway
    environment:
      SERVICE_NAME: llm-gateway
      SERVICE_PORT: "8000"
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_MIGRATION: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-deepseek}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-flash}
    ports:
      - "0.0.0.0:${LLM_GATEWAY_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}

  brief-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/brief-service/Dockerfile
    container_name: outreach-os-brief-service
    environment:
      SERVICE_NAME: brief-service
      SERVICE_PORT: "8000"
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_MIGRATION: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      LLM_GATEWAY_URL: http://llm-gateway:8000
      BRIEF_COMPLETENESS_THRESHOLD: "0.85"
      BRIEF_LLM_MODEL: ${BRIEF_LLM_MODEL:-deepseek-flash}
    ports:
      - "0.0.0.0:${BRIEF_SERVICE_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}

  contact-store:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/contact-store/Dockerfile
    container_name: outreach-os-contact-store
    environment:
      SERVICE_NAME: contact-store
